name: Deploy Home Bar

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: 212.227.28.224
      VPS_USER: deploy
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      # Cookieless Matomo analytics, injected by scripts/postprocess-web-export.mjs only when both are set.
      MATOMO_URL: ${{ vars.MATOMO_URL }}
      MATOMO_SITE_ID: ${{ vars.MATOMO_SITE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build web export
        run: npm run build:web

      - name: Configure SSH
        run: |
          test -n "$VPS_SSH_KEY" || (echo "Missing GitHub secret VPS_SSH_KEY" && exit 1)
          mkdir -p ~/.ssh
          printf "%s\n" "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload static build
        run: |
          tar -czf home-bar-dist.tar.gz -C dist .
          scp home-bar-dist.tar.gz "$VPS_USER@$VPS_HOST:/tmp/home-bar-dist.tar.gz"
          scp deploy/nginx-home-bar.conf "$VPS_USER@$VPS_HOST:/tmp/nginx-home-bar.conf"

      - name: Install static build
        run: |
          # The unprivileged deploy user may run exactly this root-owned script via sudo (see deploy/README.md).
          ssh "$VPS_USER@$VPS_HOST" 'sudo -n /usr/local/sbin/home-bar-install-static /tmp/home-bar-dist.tar.gz /tmp/nginx-home-bar.conf'
